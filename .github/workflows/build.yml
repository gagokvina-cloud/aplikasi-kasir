name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: stable
        image: kivy/buildozer:stable  # Kunci perbaikan: gunakan tag 'stable'
        pull_image: true              # Paksa Docker untuk mengunduh ulang image

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hasil-APK-Kasir
        path: ${{ steps.buildozer.outputs.filename }}
       
