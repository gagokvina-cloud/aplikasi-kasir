name: Build APK Kasir Warung

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kode Repository
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Siapkan Java 17 (Wajib untuk Gradle API 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instal Dependensi Sistem & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake lld
          python -m pip install --upgrade pip setuptools wheel packaging
          pip install "Cython==3.0.10" git+https://github.com/kivy/buildozer.git@master

      - name: Validasi & Sinkronisasi buildozer.spec
        run: |
          test -f main.py || (echo "ERROR: main.py tidak ditemukan di root repository!" && exit 1)
          test -f buildozer.spec || (echo "ERROR: buildozer.spec tidak ditemukan di root repository!" && exit 1)
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1,pyjnius/g' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/g' buildozer.spec
          sed -i 's/^android.ndk = .*/android.ndk = 28c/g' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 35/g' buildozer.spec
          grep -q "^p4a.branch" buildozer.spec || echo "p4a.branch = develop" >> buildozer.spec

      - name: Build APK Android
        run: |
          buildozer -v android debug
          ls -lh bin/*.apk

      - name: Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasirwarung-apk
          path: bin/*.apk
